<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>You're offline | Switchboard</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #16201e; color: #c3cec9; font: 16px/1.5 system-ui, sans-serif; }
    main { max-width: 26rem; padding: 2rem; }
    h1 { color: #fff; font-size: 1.75rem; margin: 1rem 0 0.5rem; }
    .lamp { width: 14px; height: 14px; border-radius: 50%; border: 2px solid #3a4744; display: inline-block; }
    a.button { display: inline-block; margin-top: 1.25rem; padding: 0.5rem 1rem; border-radius: 6px; background: #52b8c3; color: #0b1312; font-weight: 600; text-decoration: none; }
  </style>
</head>
<body>
  <main>
    <span class="lamp" aria-hidden="true"></span>
    <h1>You're offline</h1>
    <p>Switchboard needs a connection to show your tickets. Check your network, then try again.</p>
    <a class="button" href="/">Try again</a>
  </main>
</body>
</html>
